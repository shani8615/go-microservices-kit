# Local development stack. Copy .env.example to .env first.
x-service: &service
  build:
    context: .
  restart: unless-stopped
  environment: &env
    NATS_URL: nats://nats:4222
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    HTTP_ADDR: ":8080"
  depends_on:
    postgres:
      condition: service_healthy
    nats:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./deploy/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20
    ports: ["127.0.0.1:5432:5432"]

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes: [natsdata:/data]
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]

  auth:
    <<: *service
    build: { context: ., args: { SERVICE: auth } }
    environment:
      <<: *env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/auth?sslmode=disable

  orders:
    <<: *service
    build: { context: ., args: { SERVICE: orders } }
    environment:
      <<: *env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/orders?sslmode=disable

  notifications:
    <<: *service
    build: { context: ., args: { SERVICE: notifications } }
    environment:
      <<: *env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/notifications?sslmode=disable

  gateway:
    build: { context: ., args: { SERVICE: gateway } }
    restart: unless-stopped
    environment:
      AUTH_URL: http://auth:8080
      ORDERS_URL: http://orders:8080
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on: [auth, orders]
    ports: ["127.0.0.1:8080:8080"]

volumes:
  pgdata:
  natsdata:
