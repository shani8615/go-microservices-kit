name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # go.sum is generated here until it is committed (run `make tidy` locally and commit it).
      - run: go mod tidy
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -cover ./...
      # Built with the runner's Go so it always understands the module's Go version.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - run: $(go env GOPATH)/bin/golangci-lint run ./...
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, orders, notifications, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go mod tidy
      - run: docker build --build-arg SERVICE=${{ matrix.service }} -t kit-${{ matrix.service }} .
