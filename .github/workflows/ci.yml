name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # go.sum is generated here until it is committed (run `make tidy` locally and commit it).
      - run: go mod tidy
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -cover ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, orders, notifications, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go mod tidy
      - run: docker build --build-arg SERVICE=${{ matrix.service }} -t kit-${{ matrix.service }} .
